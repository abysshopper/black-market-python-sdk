name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml, e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing — no stored PyPI token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build
        run: pip install build
      - name: Verify release version matches pyproject.toml
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          MANIFEST_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${RELEASE_VERSION#v}"
          echo "release/input: ${TAG_VERSION} — pyproject: ${MANIFEST_VERSION}"
          if [ -z "${RELEASE_VERSION}" ]; then
            echo "::error::No release tag or version input provided."
            exit 1
          fi
          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::Version mismatch: release/input '${TAG_VERSION}' != pyproject.toml '${MANIFEST_VERSION}'."
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Statically verify wheel contents
        run: python tools/ci/verify_dist.py
      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
