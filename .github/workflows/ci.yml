name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  dist:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Statically verify wheel contents
        run: python tools/ci/verify_dist.py

  install-smoke:
    name: Wheel install smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --no-cache-dir dist/*.whl
      - name: Import and touch the offline API
        run: |
          /tmp/smoke-venv/bin/python -c "import black_market_sdk"
          /tmp/smoke-venv/bin/python - <<'PY'
          from black_market_sdk import get_addresses

          addresses = get_addresses(4663)
          assert addresses.abyss_router.startswith("0x"), addresses.abyss_router
          print("smoke ok:", addresses.abyss_router)
          PY
