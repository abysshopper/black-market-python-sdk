[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "black-market-sdk"
version = "0.7.0"
description = "Python SDK for Abyss token launches, swaps, and lending."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["black-market", "abyss", "robinhood-chain", "defi", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "web3>=7.0.0",
    "eth-abi>=5.0.0",
    "eth-utils>=4.0.0",
    "eth-account>=0.13.0",
    "ada-url>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["black_market_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"black_market_sdk/_sdk_abi_data.json" = "black_market_sdk/_sdk_abi_data.json"
"black_market_sdk/_lifecycle_release_20261008.json" = "black_market_sdk/_lifecycle_release_20261008.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not launch_api_http"'
markers = [
    "launch_api_http: opt-in real HTTP launch metadata API integration",
    "launch_api_write: explicitly signed metadata-session writes to a loopback test API",
]
